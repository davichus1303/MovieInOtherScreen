name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-core:
    name: Test lógica (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tests (sin dependencias de interfaz)
        run: cargo test --workspace --no-default-features
      - name: Clippy (core)
        run: cargo clippy -p mos-core -- -D warnings
      - name: Formato
        run: cargo fmt --all -- --check

  build-deb:
    name: Build .deb y release
    runs-on: ubuntu-latest
    # Solo se empaqueta (y se crea release) al pushear a master o develop,
    # nunca en pull requests.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instala dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libmpv-dev \
            libgraphene-1.0-dev \
            dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --bin movies-on-other-screens
      - name: Ensambla el paquete .deb
        run: |
          set -euxo pipefail
          PACKAGE=movies-on-other-screens
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ARCH=amd64
          DIR="debian-pkg/${PACKAGE}_${VERSION}_${ARCH}"
          mkdir -p "$DIR/DEBIAN"
          mkdir -p "$DIR/usr/bin"
          mkdir -p "$DIR/usr/share/applications"
          mkdir -p "$DIR/usr/share/metainfo"
          mkdir -p "$DIR/usr/share/icons/hicolor/scalable/apps"
          install -Dm755 target/release/movies-on-other-screens "$DIR/usr/bin/movies-on-other-screens"
          install -Dm644 data/io.github.davichus1303.MoviesOnOtherScreens.desktop "$DIR/usr/share/applications/"
          install -Dm644 data/io.github.davichus1303.MoviesOnOtherScreens.metainfo.xml "$DIR/usr/share/metainfo/"
          install -Dm644 data/icons/io.github.davichus1303.MoviesOnOtherScreens.svg "$DIR/usr/share/icons/hicolor/scalable/apps/"
          cat > "$DIR/DEBIAN/control" <<EOF
          Package: $PACKAGE
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: $ARCH
          Maintainer: Movies on Other Screens developers
          Depends: libgtk-4-1, libadwaita-1-0, libmpv2
          Description: Reproduce vídeos en múltiples monitores de forma sincronizada
          EOF
          dpkg-deb --build --root-owner-group "$DIR"
      - name: Sube el paquete como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: movies-on-other-screens-deb
          path: debian-pkg/*.deb
          if-no-files-found: error
      - name: Crea release y sube el .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-${SHA}"
          DEB=$(ls debian-pkg/*.deb)
          gh release create "$TAG" "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Movies on Other Screens ${TAG}" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            || gh release upload "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
